<script type="module">
import * as THREE from 'three';

function makeCamoTexture(){
  const c=document.createElement('canvas');c.width=512;c.height=512;const x=c.getContext('2d');

  const colors=['#5b5e67','#777a83','#c2c3c8','#e0e0e2','#858892','#454953'];
  let seed=29;const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};

const TS=[[0,2.12,0,.67,.78,.37],[0,2.42,-.015,.69,.47,.38],[0,1.54,0,.55,.20,.34],[0,1.47,0,.56,.105,.345]];
function torsoSurf(x,y,dir){
  let best=dir*9,bn=null;
  for(const [cx,cy,cz,rx,ry,rz] of TS){
    const q=1-((x-cx)/rx)**2-((y-cy)/ry)**2;if(q<=0)continue;
    const z=cz+dir*rz*Math.sqrt(q);
    if(bn===null||(dir>0?z>best:z<best)){best=z;const nx=(x-cx)/rx**2,ny=(y-cy)/ry**2,nz=(z-cz)/rz**2,l=Math.hypot(nx,ny,nz);bn=new THREE.Vector3(nx/l,ny/l,nz/l);}
  }
  return {z:best,n:bn||new THREE.Vector3(0,0,dir)};

const torsoFront=(x,y)=>torsoSurf(x,y,1), torsoBack=(x,y)=>torsoSurf(x,y,-1);
// flache Box auf die Brust "schrumpfen"
function wrapTorso(w,h,t,cx,cy,rot,m,off){
  const geo=new THREE.BoxGeometry(w,h,t,Math.max(2,Math.round(w/.03)),Math.max(2,Math.round(h/.03)),1);
  const p=geo.attributes.position,c=Math.cos(rot),s=Math.sin(rot);
  for(let i=0;i<p.count;i++){
    const vx=p.getX(i),vy=p.getY(i),vz=p.getZ(i),x=cx+vx*c-vy*s,y=cy+vx*s+vy*c;
    p.setXYZ(i,x,y,torsoFront(x,y).z+off+vz+t/2);
  }
  geo.computeVertexNormals();
  const me=new THREE.Mesh(geo,m);me.castShadow=me.receiveShadow=true;avatar.add(me);return me;
}
// Flaches Band entlang eines Pfades (Gurt)
function ribbon(pts,nrm,w,th,m){
  const pos=[],idx=[];
  for(let i=0;i<pts.length;i++){
    const t=pts[Math.min(i+1,pts.length-1)].clone().sub(pts[Math.max(i-1,0)]).normalize();
    const b=new THREE.Vector3().crossVectors(t,nrm[i]).normalize();
    const c=pts[i].clone().addScaledVector(nrm[i],th),a1=c.clone().addScaledVector(b,w/2),a2=c.clone().addScaledVector(b,-w/2);
    pos.push(a1.x,a1.y,a1.z,a2.x,a2.y,a2.z);
    if(i<pts.length-1){const k=i*2;idx.push(k,k+1,k+2,k+1,k+3,k+2);}
  }
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();
  const me=new THREE.Mesh(g,m);me.castShadow=true;return me;
}
// Taschen am Bein: Box um den (konischen) Oberschenkel gewickelt
const legR=y=>.205+.04*(y-.95)/.47;
function wrapLeg(side,arc,h,yc,phi0,t,tOff,m){
  const geo=new THREE.BoxGeometry(t,h,arc,1,Math.max(2,Math.round(h/.035)),Math.max(2,Math.round(arc/.03)));
  const p=geo.attributes.position;
  for(let i=0;i<p.count;i++){
    const y=yc+p.getY(i),R=legR(y),r=R+tOff+p.getX(i)+t/2,a=phi0+p.getZ(i)/R;
    p.setXYZ(i,r*Math.cos(a),y,r*Math.sin(a));

  geo.computeVertexNormals();
  const me=new THREE.Mesh(geo,m);me.position.set(side*.34,0,0);me.scale.x=side;me.castShadow=me.receiveShadow=true;avatar.add(me);return me;

const smooth=(geo,material,x,y,z,sx=1,sy=1,sz=1,parent=avatar)=>{const m=new THREE.Mesh(geo,material);m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m};

const gltfLoader=new GLTFLoader();

function addPhoneToHand(root){
  // Smartphone als eigenes 3D-Objekt am animierten rechten Handknochen.
  const hand=root.getObjectByName('mixamorigRightHand');
  if(!hand){console.warn('Rechter Handknochen nicht gefunden; Handy wurde nicht angeheftet.');return;}
  const phone=new THREE.Group();

    new THREE.BoxGeometry(.075,.145,.012),

    new THREE.PlaneGeometry(.066,.132),
    new THREE.MeshStandardMaterial({color:0x171d2b,metalness:.25,roughness:.18,emissive:0x080d18,emissiveIntensity:.35})
  );
  screen.position.z=.0065; phone.add(screen);
  const cameraDot=new THREE.Mesh(
    new THREE.CircleGeometry(.003,12),

  );
  cameraDot.position.set(0,.065,.0068); phone.add(cameraDot);
  // Erstposition zum Testen; nach dem ersten Live-Screenshot können wir sie fein ausrichten.
  phone.position.set(.015,.075,.012);

}
function showModel(url){
  gltfLoader.load(url,gltf=>{
    if(glbRoot)avatar.remove(glbRoot);
    const root=gltf.scene;
    let bb=new THREE.Box3().setFromObject(root);
    root.scale.setScalar(3.75/bb.getSize(new THREE.Vector3()).y);
    bb=new THREE.Box3().setFromObject(root);const c=bb.getCenter(new THREE.Vector3());
    root.position.set(-c.x,-bb.min.y,-c.z);
    root.traverse(o=>{if(o.isMesh){o.castShadow=o.receiveShadow=true;if(o.material&&'envMapIntensity' in o.material)o.material.envMapIntensity=.7}});
    addPhoneToHand(root);
    glbRoot=new THREE.Group();glbRoot.add(root);avatar.add(glbRoot);
    proc.visible=false;
    if(!envTex)envTex=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),.04).texture;
    scene.environment=envTex;
    mixer=gltf.animations.length?new THREE.AnimationMixer(root):null;
    if(mixer){
      const action=mixer.clipAction(gltf.animations[0]);
      action.setLoop(THREE.LoopRepeat,Infinity);
      action.clampWhenFinished=false;
      action.play();
    }
  },undefined,()=>console.warn('Telefonier-GLB konnte nicht geladen werden:',url));
}

let dragging=false,camY=2.15,zoomZ=8.6;
const ptrs=new Map();let pinch0=0,zoom0=0;
const updCam=()=>{camera.position.set(0,camY,zoomZ);camera.lookAt(0,camY,0)};updCam();
const pdist=()=>{const [a,b]=[...ptrs.values()];return Math.hypot(a.x-b.x,a.y-b.y)};
canvas.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});canvas.setPointerCapture(e.pointerId);dragging=true;if(ptrs.size===2){pinch0=pdist();zoom0=zoomZ}});
canvas.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  if(ptrs.size===2){p.x=e.clientX;p.y=e.clientY;if(pinch0)zoomZ=Math.max(3.2,Math.min(12,zoom0*pinch0/pdist()));updCam();return}
  avatar.rotation.y+=(e.clientX-p.x)*.012;
  camY=Math.max(.5,Math.min(3.4,camY+(e.clientY-p.y)*.01));
  p.x=e.clientX;p.y=e.clientY;updCam();
});
const endPtr=e=>{ptrs.delete(e.pointerId);if(!ptrs.size)dragging=false;pinch0=0};
canvas.addEventListener('pointerup',endPtr);
canvas.addEventListener('pointercancel',endPtr);
canvas.addEventListener('wheel',e=>{zoomZ=Math.max(3.2,Math.min(12,zoomZ+e.deltaY*.006));updCam()},{passive:true});
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
new ResizeObserver(resize).observe(canvas);
const clock=new THREE.Clock();
const baseY=avatar.position.y;
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();if(mixer)mixer.update(t-prevT);prevT=t;
  // Calm idle: gentle breathing, tiny weight shift and almost imperceptible head motion.
  const breath=Math.sin(t*1.55);
  breathingTorso.scale.y=.78*(1+breath*.009);
  upperTorso.scale.y=.47*(1+breath*.012);
  avatar.position.y=baseY+Math.sin(t*1.15)*.018;
  if(!dragging){avatar.rotation.y+=.00055;avatar.rotation.z=Math.sin(t*.65)*.003;}
  headMesh.rotation.y=Math.sin(t*.48)*.018;
  rim.intensity=45+Math.sin(t*1.2)*5;
  harborGlow.intensity=20+Math.sin(t*.8+1.4)*3;
  renderer.render(scene,camera);
}
