<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080a10">
<meta name="description" content="MediFerry – interaktiver 360-Grad-Charakter-Viewer im Hafen.">
<title>MediFerry | Character Viewer</title>
<style>
:root{color-scheme:dark;--violet:#bba2ff;--white:#f5f3fa}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a10;color:var(--white);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}
.scene{position:relative;width:100%;height:100%;isolation:isolate;background:
linear-gradient(180deg,rgba(2,4,10,.38),rgba(2,4,10,.10) 48%,rgba(2,4,10,.72)),
url("harbor.jpg") center/cover no-repeat}
.scene:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,transparent 25%,rgba(0,0,0,.45) 100%);z-index:-0}
.topbar{position:absolute;top:clamp(16px,4vh,38px);left:50%;transform:translateX(-50%);z-index:4;text-align:center;min-width:230px}
.crown{font-size:26px;line-height:1;color:#e9ddff;text-shadow:0 0 14px #a77cff}
.nameplate{margin-top:4px;padding:10px 30px;border:1px solid #c6adff;border-radius:9px;background:linear-gradient(110deg,rgba(12,10,22,.94),rgba(34,25,52,.88),rgba(12,10,22,.94));box-shadow:0 0 22px #8f67ff66,inset 0 0 12px #8f67ff33;clip-path:polygon(8% 0,92% 0,100% 50%,92% 100%,8% 100%,0 50%)}
.username{font-weight:900;letter-spacing:.08em;font-size:clamp(18px,2vw,25px);text-shadow:0 0 12px #cbb4ff}
.stage{position:absolute;inset:0;display:grid;place-items:center;z-index:2}
canvas{display:block;width:min(72vw,650px);height:min(78vh,760px);touch-action:none;cursor:grab;outline:none}
canvas:active{cursor:grabbing}
.hint{position:absolute;bottom:clamp(20px,5vh,48px);left:50%;transform:translateX(-50%);z-index:3;padding:11px 18px;border-radius:30px;background:rgba(5,7,12,.72);border:1px solid #ffffff30;color:#eee;font-size:14px;white-space:nowrap;backdrop-filter:blur(8px)}
.status{position:absolute;left:16px;bottom:14px;z-index:4;color:#ffffff8a;font-size:11px;letter-spacing:.04em}
@media(max-width:650px){canvas{width:100vw;height:75vh}.topbar{top:14px}.hint{font-size:12px;bottom:18px}.scene{background-position:48% center}}
</style>
</head>
<body>
<div class="scene">
  <header class="topbar" aria-label="Spielername">
    <div class="crown">♛</div>
    <div class="nameplate"><div class="username">MediFerry</div></div>
  </header>
  <main class="stage">
    <canvas id="viewer" aria-label="3D-Charakter. Ziehen zum Drehen."></canvas>
  </main>
  <div class="hint">↔ &nbsp; Halten &amp; ziehen zum Drehen</div>
  <div class="status">MEDIFERRY • 360° CHARACTER VIEWER</div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const canvas=document.querySelector('#viewer');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(canvas.clientWidth,canvas.clientHeight,false);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(34,canvas.clientWidth/canvas.clientHeight,.1,100);
camera.position.set(0,2.2,8.6);
const hemi=new THREE.HemisphereLight(0xb9c7e8,0x17131b,2.0);scene.add(hemi);
const key=new THREE.DirectionalLight(0xffffff,3.0);key.position.set(-3,7,5);key.castShadow=true;scene.add(key);
const rim=new THREE.PointLight(0x9e79ff,30,12);rim.position.set(3,4,-3);scene.add(rim);
const fill=new THREE.PointLight(0x91b9ff,12,10);fill.position.set(-4,2,3);scene.add(fill);

const avatar=new THREE.Group();scene.add(avatar);
const mat=(color,rough=.85,metal=0)=>new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});
const dark=mat('#101116'), mask=mat('#090a0d'), shoe=mat('#c7c8d0',.55), sole=mat('#171920'), strap=mat('#17151b');
const camoMats=['#777982','#b6b7bd','#555963','#d1d1d4','#8e9098'].map(c=>mat(c));
function mesh(geo,material,x,y,z,sx=1,sy=1,sz=1){const m=new THREE.Mesh(geo,material);m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.castShadow=true;m.receiveShadow=true;avatar.add(m);return m}
function box(x,y,z,sx,sy,sz,material){return mesh(new THREE.BoxGeometry(sx,sy,sz),material,x,y,z)}
function ell(x,y,z,sx,sy,sz,material){return mesh(new THREE.SphereGeometry(1,24,18),material,x,y,z,sx,sy,sz)}
// boots / sneakers
for(const side of [-1,1]){
  const x=side*.34;
  box(x,.17,.13,.43,.22,.72,sole);
  ell(x,.29,.12,.21,.16,.34,shoe);
  for(let i=0;i<4;i++) box(x,.38,-.02+i*.11,.28,.035,.035,dark);
  // legs, joggers
  const leg=ell(x,.93,0,.22,.72,.24,camoMats[0]);
  ell(x,.72,.02,.24,.35,.25,camoMats[2]);
  // scattered camouflage patches
  for(let i=0;i<8;i++) ell(x+(Math.random()-.5)*.24,.48+i*.13,(Math.random()-.5)*.18,.07,.11,.04,camoMats[(i%4)+1]);
}
// torso hoodie
ell(0,2.08,0,.67,.88,.38,camoMats[0]);
ell(0,2.34,-.02,.69,.48,.39,camoMats[1]);
for(let i=0;i<20;i++){const a=(i%5-2)*.22;const y=1.55+Math.floor(i/5)*.22;ell(a,y,.31,.10,.12,.035,camoMats[(i%4)+1]);}
box(0,1.34,0,1.12,.16,.42,camoMats[2]);
// arms, sleeves
for(const side of [-1,1]){
 const arm=ell(side*.77,2.12,0,.23,.68,.25,camoMats[0]);arm.rotation.z=side*-.12;
 ell(side*.81,1.56,.03,.19,.22,.20,camoMats[1]);
 ell(side*.83,1.30,.06,.13,.17,.13,mat('#b58f7c'));
 for(let i=0;i<5;i++) ell(side*.77+(Math.random()-.5)*.22,1.8+i*.12,.16,.07,.09,.035,camoMats[(i%4)+1]);
}
// neck and masked head
ell(0,2.93,0,.19,.20,.19,mat('#92786c'));
ell(0,3.34,0,.34,.46,.31,dark);
ell(0,3.30,.18,.31,.34,.18,mask);
// eye opening and eyes
box(0,3.42,.325,.43,.095,.025,mat('#09090b'));
for(const side of [-1,1]) ell(side*.105,3.43,.35,.045,.025,.018,mat('#b5a18d'));
// hood rim
const hood=ell(0,3.43,-.015,.39,.49,.34,mat('#777982'));hood.material.side=THREE.DoubleSide;
// front panel mask overlays
ell(0,3.16,.24,.27,.22,.12,mask);
// crossbody strap
const strapMesh=box(.16,2.16,.385,.13,1.75,.07,strap);strapMesh.rotation.z=-.42;
// bag at hip
ell(.46,1.43,.26,.28,.30,.15,strap);
// zipper highlight
box(.46,1.44,.42,.025,.22,.012,mat('#9b9ca4',.45,.4));
// subtle chest zipper
box(0,2.04,.395,.025,.56,.012,mat('#25262c'));
// ground ring
const ring=new THREE.Mesh(new THREE.TorusGeometry(1.02,.012,8,96),new THREE.MeshBasicMaterial({color:0xc8b8ff,transparent:true,opacity:.75}));
ring.rotation.x=Math.PI/2;ring.position.y=.02;avatar.add(ring);
const floor=new THREE.Mesh(new THREE.CircleGeometry(1.08,64),new THREE.MeshBasicMaterial({color:0x11131a,transparent:true,opacity:.22}));floor.rotation.x=-Math.PI/2;floor.position.y=.005;avatar.add(floor);

let dragging=false,lastX=0,rot=0;
canvas.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!dragging)return;rot+=(e.clientX-lastX)*.012;lastX=e.clientX;avatar.rotation.y=rot});
canvas.addEventListener('pointerup',()=>dragging=false);
canvas.addEventListener('pointercancel',()=>dragging=false);
canvas.addEventListener('wheel',e=>{camera.position.z=Math.max(6,Math.min(11,camera.position.z+e.deltaY*.006));},{passive:true});
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
new ResizeObserver(resize).observe(canvas);
function animate(){requestAnimationFrame(animate);if(!dragging)avatar.rotation.y+=0.0007;renderer.render(scene,camera)}
animate();
</script>
</body>
</html>
